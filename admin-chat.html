<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080b18">
<title>Genesis Chat</title>
<!-- [TILLAGT 2026-10-24] ADMINENS CHATTFONSTER FOR TELEFONEN (Chris): adminsidan ar desktop-only, men Chris vill folja spelchatten
     pa telefonen utan att logga in i spelet. Samma inloggning som admin.html (losenord + tvafaktor, bara personal), sedan BARA chatten.
     Laser via admin_chat_list (servern kraver chat.read). Ingen radering, inget skickande harifran. -->
<style>
:root{--bg:#080b18;--panel:#11152a;--panel2:#171c36;--border:rgba(255,255,255,.12);--text:#e7e9f5;--dim:#9aa0c3;--faint:#6b7199;
  --cyan:#5ce1e6;--gold:#ffc542;--purple:#b98cff;--red:#ff6b6b;--green:#3ecf8e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
.hidden{display:none !important}
/* inloggning */
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:16px}
.card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px}
.card h1{margin:0 0 4px;font-size:18px;letter-spacing:.04em}
.card h1 span{color:var(--cyan)}
.card p{margin:0 0 14px;color:var(--dim);font-size:13px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:16px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--cyan);color:#06222a;font-weight:700;font-size:15px}
.btn:disabled{opacity:.5}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:6px}
label.rem{display:flex;gap:8px;align-items:center;color:var(--dim);font-size:13px;margin:2px 0 12px}
label.rem input{width:auto;margin:0}
/* chatten */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--border)}
header b{font-size:15px;letter-spacing:.04em}
header b span{color:var(--cyan)}
header .st{margin-left:auto;font-size:12px;color:var(--faint)}
header .out{background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:5px 9px;font-size:12px}
.tabs{display:flex;gap:6px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--border);color:var(--dim);font-size:13px;background:none;text-transform:capitalize}
.tab.on{background:var(--cyan);border-color:var(--cyan);color:#06222a;font-weight:700}
.tab.loot{margin-left:auto}
#list{flex:1;overflow-y:auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.m{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);word-wrap:break-word;overflow-wrap:anywhere}
.m .t{color:var(--faint);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.m .w{font-weight:700;color:var(--gold)}
.m .tag{color:var(--faint);font-size:11px;font-weight:600;margin-right:3px}
.m .ch{font-size:10.5px;color:var(--purple);border:1px solid rgba(185,140,255,.4);border-radius:6px;padding:0 5px;margin-right:5px;text-transform:uppercase}
.m .to{color:var(--purple)}
.m.sys .w{color:var(--cyan)}
.m.loot{opacity:.55;font-size:13px}
.m.gone{opacity:.45;text-decoration:line-through}
.m.new{animation:nu 1.6s ease-out}
@keyframes nu{from{background:rgba(92,225,230,.18)}to{background:transparent}}
.empty{color:var(--faint);text-align:center;padding:30px 0}
#more{display:block;margin:6px auto 10px;background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:6px 12px;font-size:13px}
#jump{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--cyan);color:#06222a;border:0;border-radius:999px;padding:9px 14px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div id="g-login">
      <h1>GENESIS <span>CHAT</span></h1>
      <p>Staff only. Read-only view of the game chat.</p>
      <input id="g-email" type="email" autocomplete="username" placeholder="Email">
      <input id="g-pass" type="password" autocomplete="current-password" placeholder="Password">
      <button class="btn" id="g-go">Sign in</button>
    </div>
    <div id="g-mfa" class="hidden">
      <h1>GENESIS <span>CHAT</span></h1>
      <p>Enter the 6-digit code from your authenticator app.</p>
      <input id="g-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456">
      <label class="rem"><input type="checkbox" id="g-remember" checked> Keep me signed in on this phone</label>
      <button class="btn" id="g-verify">Verify</button>
    </div>
    <div class="err" id="g-err"></div>
  </div>
</div>
<div id="app" class="hidden">
  <header><b>GENESIS <span>CHAT</span></b><span class="st" id="st">…</span><button class="out" id="out">Sign out</button></header>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">Loading…</div></div>
  <button id="jump" class="hidden">↓ New</button>
</div>
<script src="lib/supabase-js-2.117.2.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"></script>
<script>
(() => {
const SUPA_URL = 'https://lbssixfkqoqvpapprpab.supabase.co';
const SUPA_KEY = 'sb_publishable_u2XJLvX3PRD_azBJIEWlcg_R83K1JeH';
/* Egen nyckel for sessionen, sa telefonens chattfonster och adminsidan inte stor varandra. */
const sb = supabase.createClient(SUPA_URL, SUPA_KEY, {auth: {persistSession: true, storageKey: 'genesis-admin-chat'}});
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const err = m => { $('g-err').textContent = m || ''; };
const show = id => { ['g-login','g-mfa'].forEach(x => $(x).classList.toggle('hidden', x !== id)); };
const REM = 'genesis-admin-chat-remember';
function remembered(){ try { return (+localStorage.getItem(REM) || 0) > Date.now(); } catch (e){ return false; } }

async function rpc(fn, args){ const {data, error} = await sb.rpc(fn, args || {}); if (error) throw new Error(error.message || String(error)); return data; }

async function afterSession(){
  err('');
  const {data: aal} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
  const {data: fac} = await sb.auth.mfa.listFactors();
  const totp = (fac && fac.totp || []).filter(f => f.status === 'verified');
  if (aal && aal.currentLevel === 'aal2') return enter();
  if (totp.length){ show('g-mfa'); $('g-code').focus(); return; }
  let me = null; try { me = await rpc('admin_my_perms'); } catch (e){}
  if (!me || !me.admin){ err('This account is not staff.'); await sb.auth.signOut(); show('g-login'); return; }
  if (!me.require_mfa) return enter();
  err('Set up two-factor in the Admin Center on a computer first.'); await sb.auth.signOut(); show('g-login');
}
$('g-go').onclick = async () => {
  err(''); $('g-go').disabled = true;
  const {error} = await sb.auth.signInWithPassword({email: $('g-email').value.trim(), password: $('g-pass').value});
  $('g-go').disabled = false;
  if (error){ err(error.message); return; }
  afterSession();
};
$('g-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('g-go').click(); });
$('g-verify').onclick = async () => {
  err('');
  const {data: fac} = await sb.auth.mfa.listFactors();
  const f = (fac.totp || []).find(x => x.status === 'verified'); if (!f){ err('No authenticator found.'); return; }
  const {data: ch, error: e1} = await sb.auth.mfa.challenge({factorId: f.id}); if (e1){ err(e1.message); return; }
  const {error: e2} = await sb.auth.mfa.verify({factorId: f.id, challengeId: ch.id, code: $('g-code').value.trim()});
  if (e2){ err('Wrong code.'); $('g-code').value = ''; return; }
  try { if ($('g-remember').checked) localStorage.setItem(REM, String(Date.now() + 30 * 86400000)); else localStorage.removeItem(REM); } catch (e){}
  enter();
};
$('g-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('g-verify').click(); });
$('out').onclick = async () => { try { localStorage.removeItem(REM); } catch (e){} await sb.auth.signOut(); location.reload(); };

/* ---------- chatten ---------- */
const CH = ['general', 'trade', 'whisper', 'all'];
let chan = 'general', hideLoot = true, rows = [], seen = new Set(), timer = null, firstLoad = true, limit = 120;
try { chan = localStorage.getItem('genesis-admin-chat-ch') || 'general'; hideLoot = localStorage.getItem('genesis-admin-chat-loot') !== '0'; } catch (e){}
function tabs(){
  $('tabs').innerHTML = CH.map(c => '<button class="tab' + (c === chan ? ' on' : '') + '" data-ch="' + c + '">' + c + '</button>').join('') +
    '<button class="tab loot' + (hideLoot ? '' : ' on') + '" id="loot">' + (hideLoot ? 'Loot hidden' : 'Loot shown') + '</button>';
  $('tabs').querySelectorAll('[data-ch]').forEach(b => b.onclick = () => { chan = b.dataset.ch; try { localStorage.setItem('genesis-admin-chat-ch', chan); } catch (e){} rows = []; seen.clear(); firstLoad = true; limit = 120; tabs(); load(); });
  $('loot').onclick = () => { hideLoot = !hideLoot; try { localStorage.setItem('genesis-admin-chat-loot', hideLoot ? '1' : '0'); } catch (e){} tabs(); draw(false); };
}
const hm = ts => { const d = new Date(ts); return d.toLocaleTimeString('sv-SE', {hour: '2-digit', minute: '2-digit'}); };
const isLoot = x => ['LOOT', 'BOSS', 'RIFT'].includes(String(x.sender_tag || '').toUpperCase());
const atBottom = () => { const l = $('list'); return l.scrollHeight - l.scrollTop - l.clientHeight < 60; };
function draw(fresh){
  const l = $('list'), stick = firstLoad || atBottom();
  const shown = rows.filter(x => !(hideLoot && isLoot(x)));
  if (!shown.length){ l.innerHTML = '<div class="empty">No messages.</div>'; return; }
  l.innerHTML = '<button id="more">Load older</button>' + shown.map(x => {
    const sys = x.sender_profile === '00000000-0000-0000-0000-000000000000' || x.gm;
    const nu = fresh && fresh.has(x.id);
    return '<div class="m' + (sys ? ' sys' : '') + (isLoot(x) ? ' loot' : '') + (x.status !== 'ok' ? ' gone' : '') + (nu ? ' new' : '') + '">' +
      '<span class="t">' + hm(x.created_at) + '</span>' +
      (chan === 'all' ? '<span class="ch">' + esc(x.channel) + '</span>' : '') +
      (x.sender_tag ? '<span class="tag">[' + esc(x.sender_tag) + ']</span>' : '') +
      '<span class="w">' + esc(x.sender_name) + '</span>' +
      (x.to_name ? ' <span class="to">→ ' + esc(x.to_name) + '</span>' : '') + ': ' +
      esc(String(x.body || '').replace(/\[\[(item|helper)\]\]/g, '[' + ((x.attach && x.attach[0] && (x.attach[0].key || x.attach[0].species)) || '$1') + ']')) +
      '</div>';
  }).join('');
  $('more').onclick = () => { limit = Math.min(300, limit + 120); load(); };
  if (stick) { l.scrollTop = l.scrollHeight; $('jump').classList.add('hidden'); }
  else if (fresh && fresh.size) $('jump').classList.remove('hidden');
}
async function load(){
  clearTimeout(timer);
  try {
    const data = await rpc('admin_chat_list', {p_channel: chan, p_limit: limit});
    const list = (data || []).slice().reverse();
    const fresh = new Set();
    if (!firstLoad) list.forEach(x => { if (!seen.has(x.id)) fresh.add(x.id); });
    list.forEach(x => seen.add(x.id));
    rows = list; draw(fresh); firstLoad = false;
    $('st').textContent = 'Live · ' + new Date().toLocaleTimeString('sv-SE', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  } catch (e){
    $('st').textContent = 'Offline – retrying';
    if (/jwt|auth|not.*staff|forbidden|aal/i.test(e.message)) { await sb.auth.signOut(); location.reload(); return; }
  }
  timer = setTimeout(load, document.hidden ? 30000 : 5000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').classList.contains('hidden')) load(); });
$('list').addEventListener('scroll', () => { if (atBottom()) $('jump').classList.add('hidden'); });
$('jump').onclick = () => { const l = $('list'); l.scrollTop = l.scrollHeight; $('jump').classList.add('hidden'); };
function enter(){
  $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
  tabs(); load();
}
(async () => {
  const {data} = await sb.auth.getSession();
  if (data && data.session){
    const {data: aal} = await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    if (aal && aal.currentLevel === 'aal2' && remembered()) return enter();
    return afterSession();
  }
  show('g-login');
})();
})();
</script>
</body>
</html>
