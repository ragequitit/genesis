name: Publicera sajten

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kopiera repots filer
        run: |
          mkdir -p _site
          git ls-files -z | xargs -0 cp --parents -t _site
          rm -rf _site/.github
      - name: Ta bort kommentarer
        run: |
          mkdir -p /tmp/strip && cd /tmp/strip
          npm init -y > /dev/null
          npm install --no-audit --no-fund html-minifier-terser@7.2.0
          cp "$GITHUB_WORKSPACE/.github/scripts/strip.mjs" /tmp/strip/strip.mjs
          node /tmp/strip/strip.mjs "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
