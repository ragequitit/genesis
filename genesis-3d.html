<!--
  GENESIS-KARTAN 3D, INBYGGD I SPELET  [TILLAGT v5.1353.0 - VARLDEN]
  Spelets 3D-karta. Laddas av index.html i kartramen (#map-frame) nar spelaren valt 3D (vaxeln 2D|3D, sparad i
  localStorage genesis.map3d). Bygger pa demon fran grenen genesis-world-play (three.js + KayKit-figurer, CC0,
  assets/world3d/LICENS.txt) men ALLA demons egna rutor och det pahittade DEMO-spelet ar borta: varje tryck gar till
  spelet (genesisMap.onPick = gmPick i index.html) som oppnar sina EGNA rutor - Encounter, Quest, Vendor, Vault,
  Expeditions, dungeonvalet, World Boss - precis som 2D-kartan. Kartan RAKNAR ALDRIG sjalv.
    - din figur gar dit du trycker (sokvag runt hus och vatten), WASD/pilar, joystick pa telefon. Gangen ar utseende:
      trycker man pa ett uppdrag/mote/expedition oppnas rutan DIREKT och figuren borjar ga dit samtidigt (Chris 9).
    - uppdragsgivare med ! (att hamta) och ? (klart att lamna in), graa nar man inte kan ta/lamna just nu (Chris 3)
    - noder/veins: trycket startar spelets vanliga matare direkt, ingen mellanknapp (Chris 7)
    - andra spelare i samma region syns GA i realtid (spelet skickar positioner via Supabase Realtime, setLive) (Chris 1)
    - zonchatten blir pratbubblor over figurerna (bubble) (Chris 2)
    - din aktiva hjalpare gar bredvid dig: assets/helpers3d/<art>.glb om filen finns, annars en liten platshallare (Chris 6)
    - kvar fran demon: regioner som oar, dag/natt, vader, World Boss, Find player, nyhetsfloden - med riktig data
      fran serverns world_view() (spelet hamtar och skickar setWorld; fristaende hamtas den med publika nyckeln)
  three.js ligger lokalt i lib/three-0.170.0 (ingen CDN - sajten ska fungera utan tredje part).

  ===== KONTRAKT MOT index.html (window.genesisMap) =====
  IN (spelet -> kartan), samma som 2D-kartan: setState, setTravel, setVeins, setPlayers, setNodeFlags, showRegion, showZone
     + nya: setMe({namn, klass, niva, helper:{key,namn}|null})
            setExpeditions([{id, zone:'region|zon', label, mins, lvl, state:'ready|running|locked'}])
            setLive([{id, name, x, y, face, zone, klass, niva, helper, mv}])   realtidspositioner i min region
            bubble({id|name, text})                                           pratbubbla i nagra sekunder
            setWorld(world_view-json)                                         andra spelare/boss/nyheter i hela varlden
     setState.quests far tva nya falt per uppdrag: mark ('!' eller '?') och grey (true = kravet uppfylls inte nu)
  UT (kartan -> spelet), pick(o) -> genesisMap.onPick(o) = gmPick: samma kinds som 2D-kartan (quest, encounter,
     expedition, vendor, vault, zone, dungeon, boss, region, zoneenter, travel)
     + {kind:'vein', region, zone, id, clientX, clientY}   startar matarne dar man tryckte
     + {kind:'pos', region, zone, x, y, face, mv}          min figurs plats, nagra ganger i sekunden (spelet sander vidare)
     + {kind:'player', id, name, clientX, clientY}          tryck pa en annan spelare i min zon -> spelets spelarmeny
  2D-knappen anropar parent.genesisMapSwitch('2d'). Utan WebGL gors samma sak automatiskt.
-->
<script type="importmap">
{"imports":{"three":"./lib/three-0.170.0/three.module.min.js",

</script>
<style>
  :root{
    --ink:#e8f1f5; --ink2:#9fb3c0; --panel:rgba(8,14,22,.8); --line:rgba(160,200,220,.18);
    --demo:#ff8a1f; --live:#34d399; --off:#f43f5e; --chip:rgba(12,20,30,.84); --chipOn:#2dd4bf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b1a26;color:var(--ink);

  #gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
  #gl{touch-action:none;cursor:grab}
  #gl.drag{cursor:grabbing}
  #ov{pointer-events:none}
  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud > *{pointer-events:auto}
  #top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;

  #brand{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px);

  #brand b{font-size:13px;letter-spacing:.14em;display:block;white-space:nowrap}
  #brand small{font-size:11px;color:var(--ink2);letter-spacing:.06em}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:1px}
  .badge.live{background:var(--live);color:#012015}
  .badge.off{background:var(--off);color:#fff}
  /* [TILLAGT v5.1353.0] inga hovringseffekter pa pekskarm */
  @media (hover:none){ #gl.hov{cursor:default} }
  #stats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:right;

  #feed{top:calc(max(10px,env(safe-area-inset-top)) + 96px);right:14px;width:min(300px,calc(100vw - 28px));max-height:46vh;overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:none;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px)}
  #feed.on{display:block}
  #feed h4{font-size:11px;letter-spacing:.14em;color:var(--ink2);margin-bottom:4px}
  #feed div{font-size:12px;line-height:1.4;padding:3px 0;border-top:1px solid rgba(255,255,255,.06)}
  #feed div i{font-style:normal;color:var(--ink2);font-size:10px;margin-left:6px}
  #findBtn{margin-top:6px;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 9px;
    font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
  #find{top:calc(max(10px,env(safe-area-inset-top)) + 96px);right:14px;width:min(300px,calc(100vw - 28px));max-height:52vh;overflow-y:auto;

  #find.on{display:block}
  #findIn{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:7px 9px;font-size:16px;font-family:inherit;margin-bottom:6px}
  #findList button{display:flex;justify-content:space-between;gap:8px;width:100%;background:transparent;border:0;border-top:1px solid rgba(255,255,255,.06);

  #findList button i{font-style:normal;color:var(--ink2);white-space:nowrap}
  #watch{left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 62px);transform:translateX(-50%);background:rgba(8,14,22,.7);border:1px solid var(--line);

  #watch.on{display:block}
  #watch b{color:#fde68a}
  #bottom{left:0;right:0;bottom:0;padding:0 0 max(10px,env(safe-area-inset-bottom)) 0;display:flex;flex-direction:column;align-items:stretch;gap:8px}

  #news.on{opacity:1}
  #card{align-self:flex-start;margin-left:14px;max-width:min(340px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);

  #card.on{display:block}

  #card .hd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,22,0) 0%,rgba(8,14,22,.95) 100%)}
  #card .bd{padding:4px 14px 12px}
  #card h3{font-size:16px;letter-spacing:.04em;margin-top:-24px;position:relative;z-index:1}
  #card .sub{font-size:12px;color:var(--ink2);margin-top:2px}
  #card .rows{margin-top:8px;font-size:12px;line-height:1.55;color:var(--ink)}

  #card .x{position:absolute;top:6px;right:8px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;

  #card.pl{max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);overflow-y:auto;overscroll-behavior:contain}

  .pc-now b{color:#fde68a}
  .pc-now small{display:block;color:var(--ink2);font-size:11px}
  .pc-btns{display:flex;gap:6px;margin-top:10px}
  .pc-btn{flex:1;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#bff7ee;border-radius:9px;
    padding:7px;font-size:12px;font-weight:600;line-height:1;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  .pc-btn.on{background:rgba(253,230,138,.16);border-color:#fde68a;color:#fde68a}
  .doll{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:10px;align-items:start}
  .dcol{display:flex;flex-direction:column;gap:5px}
  .dmid{display:flex;flex-direction:column;align-items:center;gap:4px}
  .dmid .fig{width:100%;max-width:120px;height:178px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  .drow{display:flex;justify-content:center;gap:5px;margin-top:6px}
  .slot{width:44px;height:44px;border-radius:9px;background:#0b131c;border:1.5px solid rgba(255,255,255,.1);position:relative;cursor:pointer;padding:0;
    display:block;overflow:hidden;font-family:inherit}
  .slot .sbg{position:absolute;inset:6px;background:center/contain no-repeat;opacity:.22}
  .slot.has{border-color:var(--rc);box-shadow:inset 0 0 12px -3px var(--rc)}
  .slot.has img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
  .slot.sel{outline:2px solid #fff;outline-offset:1px}
  .itemline{min-height:30px;font-size:12px;margin-top:8px;text-align:center;line-height:1.35}
  .itemline small{display:block;color:var(--ink2);font-size:11px}
  #chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:8px 13px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.boss{border-color:#f43f5e;color:#ffd0d8}
  .chip i{font-style:normal;color:var(--ink2);font-weight:500;margin-left:5px}
  #zoom{right:14px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  #zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
  #note{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font-size:13px;color:var(--ink2);display:none;text-align:center}
  #banner{left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 120px);transform:translate(-50%,-50%) scale(.9);text-align:center;opacity:0;transition:opacity .6s,transform .6s;pointer-events:none}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner b{display:block;font-size:clamp(18px,3.6vw,32px);letter-spacing:.1em;white-space:nowrap;font-weight:900;color:#fff;
    text-shadow:0 0 18px rgba(244,63,94,.9),0 3px 6px #000}
  #banner small{display:block;margin-top:2px;font-size:clamp(11px,2vw,14px);font-weight:700;letter-spacing:.2em;color:#fecdd3;text-shadow:0 2px 4px #000}
  #banner.gold b{text-shadow:0 0 18px rgba(250,204,21,.95),0 3px 6px #000}
  #banner.gold small{color:#fde68a}
  #loading{left:50%;bottom:30%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:12px;color:var(--ink2);letter-spacing:.06em}
  body.embed #top, body.embed #bottom, body.embed #zoom, body.embed #feed, body.embed #find{display:none}
  /* [TILLAGT genesis-world-play] */
  #gl.hov{cursor:pointer}
  #dimTog{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
  /* [TILLAGT v5.1353.0] I SPELETS RAM: spelet har vaxeln 2D|3D uppe till vanster och "Close" uppe till hoger pa telefon,
     sa kartans eget huvud flyttas ner en rad och kartans egen vaxel doljs. */
  body.inframe #dimTog{display:none}
  body.inframe #top{padding-top:48px}
  body.inframe #feed,body.inframe #find{top:142px}
  body.inframe #watch{top:108px}
  body.inframe #toast{top:118px}
  body.inframe #banner{top:166px}
  #dimTog button{background:transparent;border:0;color:var(--ink2);font:800 11px/1 inherit;font-family:inherit;letter-spacing:.1em;padding:6px 11px;cursor:pointer}
  #dimTog button.on{background:var(--chipOn);color:#032a26}
  #travel{left:50%;transform:translateX(-50%);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 56px);display:none;align-items:center;gap:10px;
    background:var(--panel);border:1px solid rgba(253,224,71,.45);border-radius:14px;padding:8px 10px 8px 14px;max-width:calc(100vw - 28px);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #travel.on{display:flex}
  #travel .w{min-width:0}
  #travel b{display:block;font-size:13px;color:#fde68a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #travel small{display:block;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #trBtn{flex-shrink:0;background:#fde047;color:#1a1200;border:0;border-radius:10px;padding:9px 12px;font:800 12px/1 inherit;font-family:inherit;letter-spacing:.05em;cursor:pointer}
  #trBtn:disabled{background:#475569;color:#cbd5e1;cursor:default}
  #toast{left:50%;transform:translateX(-50%);top:calc(max(10px,env(safe-area-inset-top)) + 72px);background:rgba(8,14,22,.88);border:1px solid var(--line);border-radius:999px;
    padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;max-width:calc(100vw - 28px);overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}
  #joy{left:18px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 62px);width:112px;height:112px;border-radius:50%;background:rgba(8,14,22,.35);border:2px solid rgba(255,255,255,.25);
    display:none;touch-action:none;pointer-events:auto}
  body.joyon #joy{display:block}
  #joyK{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(253,224,71,.85);box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none}
  #help{left:14px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 58px);font-size:11px;color:var(--ink2);background:rgba(8,14,22,.6);border-radius:8px;padding:5px 9px;pointer-events:none}
  body.joyon #help{display:none}
  body.tr-on #news{display:none}
  .chip.me{border-color:#fde047;color:#fde68a}
  @media (max-width:640px){
    #legend{display:none}
    #brand small{display:none}
    #brand b{font-size:11px;letter-spacing:.08em}
    #brand .long{display:none}
    #top{gap:6px}
    #stats{flex-shrink:0}
    #feedBtn,#findBtn{padding:4px 7px}

    body.inframe #top{padding-top:54px}
    body.inframe #feed,body.inframe #find{top:150px}
    body.inframe #watch{top:120px}
    #watch{top:calc(max(10px,env(safe-area-inset-top)) + 108px)}
    #stats{font-size:11px;padding:7px 10px}
    #stats b{font-size:13px}
    #zoom{display:none}
    .wide{display:none}
    #feed{top:calc(max(10px,env(safe-area-inset-top)) + 84px)}
    #card:not(.pl) .rows{columns:2;column-gap:12px;font-size:11px}
    #card .hd{height:52px}
    #card{max-width:calc(100vw - 28px);width:calc(100vw - 28px)}

    .dmid .fig{height:150px}
    body.card-on #news{display:none}
    #travel{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 52px);left:14px;right:14px;transform:none}
    #dimTog button{padding:5px 8px}
    body.joyon #joy{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 118px);width:100px;height:100px}
  }
</style>

<body>

<canvas id="ov"></canvas>

<script>
/* Reserv: gar WebGL eller three.js (CDN) inte att starta visas den ritade 2D-vyn i stallet. */
/* [ANDRAT v5.1353.0] utan WebGL (eller om three.js inte startar inom 15 s) byter spelet tillbaka till 2D-kartan */
window.__gwTo2d = function(why){ try { if (parent !== window && typeof parent.genesisMapSwitch === 'function'){ parent.genesisMapSwitch('2d', why || 'nowebgl'); return; } } catch (e){}

function makeWaterNormals(){ const n = 256, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), im = g.createImageData(n, n);
  const r = rng(99), waves = []; for (let i = 0; i < 9; i++) waves.push({kx: Math.round((r() - .5) * 12), ky: Math.round((r() - .5) * 12), a: .4 + r(), p: r() * 6.28});
  const h = (x, y) => waves.reduce((s, w) => s + w.a * Math.sin((w.kx * x + w.ky * y) / n * 6.2832 + w.p), 0);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){ const dx = h(x + 1, y) - h(x - 1, y), dy = h(x, y + 1) - h(x, y - 1); const i = (y * n + x) * 4;
    const nx = -dx * .35, ny = -dy * .35, nz = 1, L = Math.hypot(nx, ny, nz); im.data[i] = (nx / L * .5 + .5) * 255; im.data[i + 1] = (ny / L * .5 + .5) * 255; im.data[i + 2] = (nz / L * .5 + .5) * 255; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(60 * BIG, 60 * BIG); return t; }

function groundTexture(R){
  const pad = 30, x0 = R.bb.x0 - pad, y0 = R.bb.y0 - pad, w = R.bb.x1 - R.bb.x0 + pad * 2, h = R.bb.y1 - R.bb.y0 + pad * 2;
  const sc = Math.min(1.6, (MOBILE ? 2048 : 3072) / w), c = document.createElement('canvas'); c.width = Math.ceil(w * sc); c.height = Math.ceil(h * sc);
  const g = c.getContext('2d', {willReadFrequently: true}), th = R.th, r = rng(hash(R.id + '|tex'));
  g.setTransform(sc, 0, 0, sc, -x0 * sc, -y0 * sc);
  const poly = (pp) => { g.beginPath(); g.moveTo(pp[0].x, pp[0].y); for (let i = 1; i < pp.length; i++) g.lineTo(pp[i].x, pp[i].y); g.closePath(); };
  g.fillStyle = th.sand; g.fillRect(x0, y0, w, h);
  if (R.locked){ g.fillStyle = th.ground; R.polys.forEach(pp => { poly(pp); g.fill(); }); }
  else {
    g.save(); poly(R.outline); g.clip();
    R.zones.forEach(z => { const base = mix(th.ground, R.acc[z.i], z.i === 5 ? .2 : .13);
      poly(z.poly); g.fillStyle = z.i === 5 ? mix(base, '#2a1f2e', .3) : mix(base, z.i % 2 ? '#000000' : '#ffffff', .05); g.fill(); });
    /* sarskilda markslag per zon */
    const zf = (i, col, a) => { const z = R.zones[i]; g.save(); poly(z.poly); g.clip(); g.fillStyle = rgba(col, a); g.fillRect(x0, y0, w, h); g.restore(); };
    if (R.id === 'drakemark'){ zf(2, '#d8bd7c', .55); zf(1, '#4a5a3a', .35); zf(5, '#3a3036', .35); }
    if (R.id === 'voxholm'){ zf(3, '#6b4a3a', .45); zf(2, '#8a8070', .35); }
    if (R.id === 'cutlassbay'){ zf(4, '#d9c48a', .4); zf(3, '#c9b47e', .35); }
    if (R.id === 'quarantine'){ zf(2, '#6a6a66', .45); zf(3, '#5d5c58', .45); zf(0, '#7a7466', .3); }
    /* flackar, smasten och gras-prickar sa marken inte ar enfargad */
    for (let i = 0; i < 900 * BIG * BIG; i++){ const z = R.zones[i % 6], q = z.pts[Math.floor(r() * z.pts.length)];
      g.fillStyle = r() < .5 ? 'rgba(255,255,230,.06)' : 'rgba(0,30,0,.07)'; g.beginPath(); g.ellipse(q.x + (r() - .5) * 20, q.y + (r() - .5) * 20, 10 + r() * 40, 8 + r() * 28, r() * 3, 0, 6.2832); g.fill(); }
    for (let i = 0; i < 2600 * BIG * BIG * .6; i++){ const z = R.zones[i % 6], q = z.pts[Math.floor(r() * z.pts.length)];
      g.fillStyle = r() < .5 ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.1)'; g.fillRect(q.x + (r() - .5) * 14, q.y + (r() - .5) * 14, 1.6, 1.6); }
    /* plattor i rymdregionen, rutnat i klossvarlden */
    if (R.kind === 'plated' || R.kind === 'blocky'){ g.strokeStyle = R.kind === 'plated' ? 'rgba(20,30,40,.28)' : 'rgba(0,40,0,.12)'; g.lineWidth = 1;
      const s = R.kind === 'plated' ? 30 : 14; g.beginPath(); for (let x = Math.floor(x0 / s) * s; x < x0 + w; x += s){ g.moveTo(x, y0); g.lineTo(x, y0 + h); }
      for (let y = Math.floor(y0 / s) * s; y < y0 + h; y += s){ g.moveTo(x0, y); g.lineTo(x0 + w, y); } g.stroke(); }
    /* dammar och lava */
    R.flat = [];
    const pondZ = {drakemark: [1, 1, 1, 1, 2, 4], cutlassbay: [1, 1, 1, 2], voxholm: [0, 0, 4], quarantine: [4]}[R.id] || [];
    pondZ.forEach((zi, k) => { const z = R.zones[zi], q = z.wild[Math.floor(r() * z.wild.length)], rx = 18 + r() * 26, ry = 12 + r() * 16;
      g.fillStyle = '#3c7f95'; g.beginPath(); g.ellipse(q.x, q.y, rx, ry, r() * 3, 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(220,250,255,.35)'; g.lineWidth = 2; g.stroke(); R.flat.push({type: 'pond', x: q.x, y: q.y, r: Math.max(rx, ry)}); });
    if (R.id === 'voxholm'){ const z = R.zones[3]; for (let k = 0; k < 16; k++){ const q = z.wild[Math.floor(r() * z.wild.length)], s = 10 + r() * 10;
      g.fillStyle = '#ff6a1a'; g.fillRect(q.x - s, q.y - s * .7, s * 2, s * 1.4); g.fillStyle = '#ffd04a'; g.fillRect(q.x - s * .5, q.y - s * .3, s, s * .6);
      R.flat.push({type: 'lava', x: q.x, y: q.y, r: s}); } }
    /* stigar */
    g.lineCap = 'round'; g.lineJoin = 'round';
    R.paths.forEach(([a, b]) => { g.strokeStyle = rgba(th.path, R.kind === 'city' ? .95 : .8); g.lineWidth = R.kind === 'city' ? 16 : 11; g.beginPath(); g.moveTo(a.x, a.y);
      const mx = (a.x + b.x) / 2 + (r() - .5) * 30, my = (a.y + b.y) / 2 + (r() - .5) * 30; g.quadraticCurveTo(mx, my, b.x, b.y); g.stroke();
      if (R.kind === 'city'){ g.setLineDash([8, 9]); g.strokeStyle = 'rgba(250,220,120,.7)'; g.lineWidth = 1.4; g.stroke(); g.setLineDash([]); } });
    R.zones.forEach(z => { g.fillStyle = rgba(th.path, .85); g.beginPath(); g.ellipse(z.c.x, z.c.y, 26, 20, 0, 0, 6.2832); g.fill(); });
    /* hamnplanen */
    { const L = R.landing; g.fillStyle = rgba(th.path, .95); g.beginPath(); g.ellipse(L.x, L.y, L.r * .8, L.r * .62, Math.atan2(L.uy, L.ux), 0, 6.2832); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = 2; g.stroke(); }
    /* zongranser: svag streckad linje */
    g.setLineDash([7, 6]); g.lineWidth = 1.6; g.strokeStyle = 'rgba(20,20,10,.28)'; R.zones.forEach(z => { poly(z.poly); g.stroke(); }); g.setLineDash([]);
    g.restore();
    /* strand innanfor kusten */
    poly(R.outline); g.strokeStyle = th.sand; g.lineWidth = 16; g.stroke();
  }
  R.polys.slice(1).forEach(pp => { poly(pp); g.fillStyle = th.sand; g.fill(); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return {tex: t, x0, y0, w, h}; }

function extrudeLand(pp, depth, matTop, matSide){
  const sh = new THREE.Shape(pp.map(q => new THREE.Vector2(q.x * K, -q.y * K)));

  const m = new THREE.Mesh(geo, [matTop, matSide]); m.receiveShadow = true; m.castShadow = false; return m; }

  const geo = new THREE.ShapeGeometry(sh); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color, transparent: true, opacity, depthWrite: false})); m.position.y = y; m.renderOrder = 1; return m; }

function makeTemplate(key, node){
  node.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(node.matrixWorld).invert(), box = new THREE.Box3(), parts = [];
  node.traverse(o => { if (!o.isMesh) return; const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    o.geometry.computeBoundingBox(); const b = o.geometry.boundingBox.clone().applyMatrix4(m); box.union(b); parts.push({geo: o.geometry, mat: o.material, m}); });
  if (!parts.length) return;
  const sz = box.getSize(new THREE.Vector3()), want = SIZE[key] || ['w', 1];
  const s = want[0] === 'h' ? want[1] / (sz.y || 1) : want[1] / (Math.max(sz.x, sz.z) || 1);
  const fix = new THREE.Matrix4().makeScale(s, s, s).multiply(new THREE.Matrix4().makeTranslation(-(box.min.x + box.max.x) / 2, -box.min.y, -(box.min.z + box.max.z) / 2));
  parts.forEach(p => { p.m = new THREE.Matrix4().multiplyMatrices(fix, p.m); if (p.mat && p.mat.map) p.mat.map.anisotropy = 4; });
  TPL[key] = {parts, h: sz.y * s, w: Math.max(sz.x, sz.z) * s};
}
