<!--
  GENESIS-VARLDEN  [TILLAGT genesis-world]
  Fristaende, skrivskyddad askadarvy av Project Genesis. Ror aldrig spelet: inga anrop till spelets
  server, ingen inloggning, inga knappar som andrar nagot. Ta bort filen = vyn ar borta, inget annat paverkas.

  DATAKALLA
    ?src=<url>       JSON enligt kontraktet nedan, hamtas om var 20:e sekund (?every=<sek>, minst 5)
    DATAKALLA        konstanten forst i skriptet (null = DEMO)
    postMessage      {genesisWorld: <kontrakt>} fran sidan som baddar in vyn (iframe)
    ?embed=1         dolj rubrik och knappar (for inbaddning i Whippit-varlden)
    ?view=<id>|boss  starta inzoomad pa en region (t.ex. ?view=drakemark) eller pa World Boss
    Utan nagon kalla kor sidan DEMO-lage med pahittade spelare, tydligt markt DEMO.

  KONTRAKT (JSON) - bara spelnamn, aldrig konto-id, e-post eller annat personligt
  {
    "uppdaterad": "2026-10-28T21:14:00Z",            // ISO-tid da sammanfattningen gjordes
    "regioner": [                                     // valfri: tom/saknas = inbyggda namn
      {"id":"voxholm", "namn":"Voxholm"}              // id: voxholm|drakemark|cutlassbay|novacommand|quarantine
    ],
    "spelare": [
      {"namn":"Whippen", "niva":34,
       "region":"cutlassbay", "zon":"Wreck Reef",     // zon = zonnamn eller index 0-5 (5 = regionens dungeon)
       "aktivitet":"idle",                            // idle | strid | expedition | dungeon | resa | yrke
       "mal":{"region":"novacommand","zon":"The Dock Ring"},   // bara vid resa, annars null
       "framsteg":0.4,                                // valfri, 0-1 hur langt resan kommit
       "info":{                                       // valfri: visas i spelarrutan nar man trycker pa figuren
         "klass":"warden",                            // breaker | prospector | fabricator | warden | runner
         "paragon":12, "titel":"the Unbroken",
         "guild":{"namn":"Iron Owls","tag":"OWL"},    // eller null
         "gs":2256,                                   // gear score (snitt per plats, som i spelet)
         "gear":[                                     // det spelaren bar, plats = karaktarsbladets nummer
           {"slot":0, "key":"phase_cap", "rarity":3, "level":44}
           // slot 0 huvud, 1 brost, 2 ben, 3 handskar, 4 fotter, 5 vapen, 6 hals, 7 balte, 8 ring,
           // 9 offhand, 11 transport, 12 ring 2, 13 relik, 14 karaktarssten.  rarity 0-5 = Common..Mythic
           // valfritt per pjas: "namn" och "bild" (assets/...webp). Saknas de slas nyckeln upp i spelets
           // katalog (genesis-catalog i index.html), som hamtas forsta gangen en ruta med utrustning oppnas.
         ]}}
    ],
    "helpare": [                                      // valfri: hjalpare ute pa expedition
      {"namn":"Pip", "agare":"Whippen", "region":"drakemark", "zon":"Troll Mire"}
    ],
    "worldboss": {                                    // eller null
      "namn":"Vharok", "nyckel":"vharok",             // nyckel = bild i assets/worldboss/live/<nyckel>_idle.webp
      "region":"drakemark", "zon":"The Spine",
      "lage":"annonserad",                            // annonserad | pagar | dod
      "hp_pct":100,                                   // 0-100
      "start":"2026-10-28T22:00:00Z"                  // valfri: nar en annonserad boss landar (nedrakning)
    }
  }
  Okanda falt ignoreras. Okand region hoppas over. Okand zon -> spelaren hamnar i en vanlig zon i regionen.
-->
<style>
  :root{
    --ink:#e8f1f5; --ink2:#9fb3c0; --panel:rgba(8,14,22,.78); --line:rgba(160,200,220,.18);
    --demo:#ff8a1f; --live:#34d399; --off:#f43f5e; --chip:rgba(12,20,30,.82); --chipOn:#2dd4bf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#061019;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  canvas#w{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#w.drag{cursor:grabbing}
  .hud{position:fixed;z-index:2;pointer-events:none}
  .hud > *{pointer-events:auto}
  #top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    padding:max(10px,env(safe-area-inset-top)) 14px 0 14px}
  #brand{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);min-width:0}
  #brand b{font-size:13px;letter-spacing:.14em;display:block;white-space:nowrap}
  #brand small{font-size:11px;color:var(--ink2);letter-spacing:.06em}
  .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:1px}
  .badge.demo{background:var(--demo);color:#1a0d00}
  .badge.live{background:var(--live);color:#012015}
  .badge.off{background:var(--off);color:#fff}
  #stats{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:right;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:12px;color:var(--ink2);min-width:0}
  #stats b{color:var(--ink);font-size:14px}
  #legend{margin-top:4px;font-size:11px;white-space:nowrap}
  #bottom{left:0;right:0;bottom:0;padding:0 0 max(10px,env(safe-area-inset-bottom)) 0;display:flex;flex-direction:column;align-items:stretch;gap:8px}
  #card{align-self:flex-start;margin-left:14px;max-width:min(340px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none}
  #card.on{display:block}
  #card .hd{height:64px;background-size:cover;background-position:center;position:relative}
  #card .hd::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,14,22,0) 0%,rgba(8,14,22,.95) 100%)}
  #card .bd{padding:4px 14px 12px}
  #card h3{font-size:16px;letter-spacing:.04em;margin-top:-24px;position:relative;z-index:1}
  #card .sub{font-size:12px;color:var(--ink2);margin-top:2px}
  #card .rows{margin-top:8px;font-size:12px;line-height:1.55;color:var(--ink)}
  #card .rows span{color:var(--ink2)}
  #card .x{position:absolute;top:6px;right:8px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:8px;
    width:28px;height:28px;font-size:16px;cursor:pointer}
  #card.pl{max-height:calc(100vh - 150px);max-height:calc(100dvh - 150px);overflow-y:auto;overscroll-behavior:contain}
  .pc-title{font-size:11px;color:#ffc542;letter-spacing:.05em;position:relative;z-index:1;margin-top:-40px;margin-bottom:22px;text-shadow:0 1px 3px #000}
  .pc-meta{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;color:var(--ink2);margin-top:6px}
  .pc-meta b{color:var(--ink);font-weight:700}
  .pc-cls{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .pc-btn{margin-top:10px;width:100%;background:rgba(45,212,191,.12);border:1px solid rgba(45,212,191,.45);color:#bff7ee;border-radius:9px;
    padding:7px;font-size:12px;font-weight:600;line-height:1;letter-spacing:.06em;cursor:pointer;font-family:inherit}
  .doll{display:grid;grid-template-columns:auto 1fr auto;gap:6px;margin-top:10px;align-items:start}
  .dcol{display:flex;flex-direction:column;gap:5px}
  .dmid{display:flex;flex-direction:column;align-items:center;gap:4px}
  .dmid .fig{width:100%;max-width:120px;height:178px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
  .drow{display:flex;justify-content:center;gap:5px;margin-top:6px}
  .slot{width:44px;height:44px;border-radius:9px;background:#0b131c;border:1.5px solid rgba(255,255,255,.1);position:relative;cursor:pointer;padding:0;
    display:block;overflow:hidden;font-family:inherit}
  .slot .sbg{position:absolute;inset:6px;background:center/contain no-repeat;opacity:.22}
  .slot.has{border-color:var(--rc);box-shadow:inset 0 0 12px -3px var(--rc)}
  .slot.has img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:contain}
  .slot.sel{outline:2px solid #fff;outline-offset:1px}
  .itemline{min-height:30px;font-size:12px;margin-top:8px;text-align:center;line-height:1.35}
  .itemline small{display:block;color:var(--ink2);font-size:11px}
  #chips{display:flex;gap:6px;overflow-x:auto;padding:0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:999px;
    padding:8px 13px;font-size:12px;font-weight:600;letter-spacing:.04em;cursor:pointer;white-space:nowrap;font-family:inherit}
  .chip.on{border-color:var(--chipOn);color:#bff7ee}
  .chip.boss{border-color:#f43f5e;color:#ffd0d8}
  .chip i{font-style:normal;color:var(--ink2);font-weight:500;margin-left:5px}
  #zoom{right:14px;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
  #zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-size:20px;line-height:1;cursor:pointer;font-family:inherit}
  #note{left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 16px;font-size:13px;color:var(--ink2);display:none;text-align:center}
  body.embed #top, body.embed #bottom, body.embed #zoom{display:none}
  @media (max-width:640px){
    #legend{display:none}
    #brand small{display:none}
    #brand b{font-size:12px;letter-spacing:.1em}
    #stats{font-size:11px;padding:7px 10px}
    #stats b{font-size:13px}
    #zoom{display:none}
    .wide{display:none}
    #stats div{white-space:nowrap}
    #card:not(.pl) .rows{columns:2;column-gap:12px;font-size:11px}
    #card .hd{height:52px}
    #card{max-width:calc(100vw - 28px);width:calc(100vw - 28px)}
    #card.pl{max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px)}
    .slot{width:40px;height:40px}
    .dmid .fig{height:150px}
  }
</style>

<body>
<canvas id="w"></canvas>
<div class="hud" id="top">

</div>

<script>
'use strict';
/* ===== INSTALLNINGAR ===== */
const DATAKALLA = null;   // URL till JSON enligt kontraktet ovan. null = DEMO (om ingen ?src= anges)
const Q = new URLSearchParams(location.search);
const SRC = Q.get('src') || DATAKALLA;
const EVERY = Math.max(5, +Q.get('every') || 20) * 1000;
if (Q.get('embed') === '1') document.body.classList.add('embed');

/* ===== SMA HJALPARE ===== */
const $ = id => document.getElementById(id);
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hex(c){ const v = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16)); }
function mix(a, b, t){ const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(c, a){ const v = hex(c); return 'rgba(' + v[0] + ',' + v[1] + ',' + v[2] + ',' + a + ')'; }
function inPoly(poly, x, y){ let c = false;
  for (let a = 0, b = poly.length - 1; a < poly.length; b = a++){
    const xi = poly[a].x, yi = poly[a].y, xj = poly[b].x, yj = poly[b].y;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-6) + xi)) c = !c;
  } return c; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ===== VARLDEN =====
   Regionernas lagen (lon/lat) och zonernas former kommer fran spelets karta (genesis-map.html):
   samma uppdelning i sex celler och samma slumpfro, sa zonerna ligger dar de ligger pa kartan.
   Zonerna slas ihop till ETT landomrade per region; kusten far en egen mjuk brus-kant. */
const REG = [
  {id:'voxholm', namn:'Voxholm', band:'1–10', lon:-2.62, lat:0.40, size:1.05, kind:'blocky',
    zoner:['The Grasslands','The Village','The Mineshaft','The Lava Layer','The Skybuild','The Deepshaft'],
    acc:['#34d399','#22d3ee','#4ade80','#ff4a12','#38bdf8','#a855f7'],
    th:{ground:'#69a84a', cliff:'#7a5532', cliff2:'#4a321c', leaf:'#45a83c', leaf2:'#2e7f2a', rock:'#8d939a', edge:'#8ee06a', sand:'#cdbb7a'},
    deco:[['cubetree','cubetree','rock','flower'],['house','cubetree','house','flower'],['rock','rock','cubetree','crystal'],
          ['lava','rock','lava','rock'],['tower','cubetree','tower','rock'],['rock','crystal','rock']]},
  {id:'drakemark', namn:'Drakemark', band:'11–20', lon:-1.57, lat:-0.26, size:1.15, kind:'mountains',
    zoner:['Gnome Square','Troll Mire','Sand Valley','The Black Keep','The Spine','The Dragon Nest'],
    acc:['#a855f7','#22d3ee','#dcb471','#8b5cf6','#34d399','#f43f5e'],
    th:{ground:'#4f7040', cliff:'#56456a', cliff2:'#2c2238', leaf:'#2f6b3c', leaf2:'#214a2c', rock:'#837d96', edge:'#e0b64f', sand:'#c9b27a'},
    deco:[['house','oak','house','pine'],['deadtree','pond','deadtree','oak'],['rock','deadtree','rock','pine'],
          ['tower','pine','ruin','pine'],['mountain','pine','pine','rock'],['rock','crystal','mountain','rock']]},
  {id:'cutlassbay', namn:'Cutlass Bay', band:'21–30', lon:-0.52, lat:0.36, size:1.1, kind:'islands',
    zoner:['Port Town','The Shallows','Jungle Climb','Wreck Reef',"Smuggler's Cove",'The Black Hull'],
    acc:['#22d3ee','#2dd4bf','#34d399','#38bdf8','#818cf8','#d946ef'],
    th:{ground:'#76a952', cliff:'#a07c4c', cliff2:'#5e4526', leaf:'#38a14a', leaf2:'#237536', rock:'#9a927f', edge:'#5fe3cf', sand:'#e6d49b'},
    deco:[['house','palm','house','palm'],['pond','palm','rock','palm'],['palm','oak','palm','palm'],
          ['wreck','rock','wreck','palm'],['rock','palm','rock','wreck'],['wreck','rock','palm']]},
  {id:'novacommand', namn:'The Last Armada', band:'31–40', lon:0.52, lat:-0.30, size:1.0, kind:'plated',
    zoner:['The Dock Ring','The Garrison','Alien Bazaar','Asteroid Field','The Silent Cruiser','The Flagship'],
    acc:['#60a5fa','#22d3ee','#a855f7','#818cf8','#38bdf8','#f43f5e'],
    th:{ground:'#5e6c7a', cliff:'#3a4756', cliff2:'#1d252f', leaf:'#4f8f8c', leaf2:'#356663', rock:'#727a86', edge:'#9fd8ff', sand:'#8796a5'},
    deco:[['dome','antenna','dome','box'],['box','tower','box','antenna'],['dome','crystal','dome','box'],
          ['rock','rock','crystal','rock'],['ship','antenna','box'],['ship','antenna','box']]},
  {id:'quarantine', namn:'The Quarantine', band:'41–50', lon:1.57, lat:0.32, size:1.05, kind:'city',
    zoner:['The Wall','The Suburbs','The Mall','The Overpass','The Farm','The Hospital'],
    acc:['#f59e0b','#facc15','#22d3ee','#a855f7','#34d399','#f43f5e'],
    th:{ground:'#8b8452', cliff:'#6a5634', cliff2:'#3b2f1c', leaf:'#6f7e3c', leaf2:'#4d5a28', rock:'#8e8571', edge:'#f0b64a', sand:'#bfae7c'},
    deco:[['wall','box','wall','deadtree'],['house','deadtree','house','oak'],['box','box','car','box'],
          ['ruin','car','ruin','rock'],['field','oak','field','house'],['box','car','box']]},
  {id:'windfall', namn:'Windfall', band:'41–50', lon:1.57, lat:-0.56, size:1.0, kind:'clouds', locked:true}
];
const REG_BY = {}; REG.forEach(r => REG_BY[r.id] = r);

/* Kartans tre uppdelningar (genesis-map.html, LAYOUTS) - kopierade ordagrant. */
const LAYOUTS = {
  def:{ fixed:['nw','ne','se','sw','n1','n2','e1','s1','s2','wA'],
    V:{ nw:[250,86], n1:[453,58], n2:[789,50], ne:[1055,72], e1:[1061,240], se:[1037,408], s1:[773,424], s2:[468,414], sw:[253,350], wA:[252,216],
        jA1:[458,180], jA2:[468,300], jB1:[807,170], jB2:[818,300] },
    LOOPS:[['nw','n1','jA1','wA'],['n1','n2','jB1','jA1'],['n2','ne','e1','jB1'],['wA','jA1','jA2','s2','sw'],['jA1','jB1','jB2','s1','s2','jA2'],['jB1','e1','se','s1','jB2']] },
  cutlassbay:{ fixed:['nw','ne','se','sw','n1','n2','e1','s1','s2','wA'], jitter:[16,13], inset:10, wob:0.11, wobCap:14,
    V:{ nw:[250,86], n1:[453,58], n2:[789,50], ne:[1053,72], e1:[1061,240], se:[1037,408], s1:[773,424], s2:[468,414], sw:[253,350], wA:[252,216],
        jA1:[458,180], jA2:[468,300], jB1:[807,170], jB2:[818,300] },
    LOOPS:[['n1','n2','jB1','jA1'],['nw','n1','jA1','wA'],['wA','jA1','jA2','s2','sw'],['jA1','jB1','jB2','s1','s2','jA2'],['n2','ne','e1','jB1'],['jB1','e1','se','s1','jB2']] },
  drakemark:{ fixed:['A','B','C','D','E','F','G','H','H2','I','J','W','R1','R2'], jitter:[18,14],
    V:{ A:[250,96], B:[412,66], C:[661,50], D:[845,54], E:[1053,66], F:[1060,254], G:[1036,404], H:[903,424], H2:[751,424], I:[557,418], J:[253,364], W:[252,242],
        P:[428,238], Q:[589,200], R1:[786,208], R2:[840,222], S:[632,326], T:[773,330] },
    LOOPS:[['A','B','P','W'],['B','C','Q','P'],['W','P','Q','S','I','J'],['S','Q','R1','T','H2','I'],['C','D','E','F','R2','R1','Q'],['R1','R2','F','G','H','H2','T']] }
};
const CX0 = 655, CY0 = 237;           // mitten av kartans regionruta
const WSX = 860, WSY = 900;           // lon/lat -> varldsenheter
const TH = 26;                        // landets tjocklek (klippan)
const YAW = 0.30, TILT = 0.56;        // kamerans vinkel
const CY_ = Math.cos(YAW), SY_ = Math.sin(YAW);
function P(wx, wy, h){ return {x: wx * CY_ - wy * SY_, y: (wx * SY_ + wy * CY_) * TILT - (h || 0)}; }

/* Kustlinje: tat linje, mjukad, sedan brus utat/inat. Typen styr kanslan (blockig, taggig, platar). */
function closedResample(pts, step){
  const out = []; let carry = 0;
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i + 1) % pts.length], L = Math.hypot(b.x - a.x, b.y - a.y);
    let d = carry; while (d < L){ out.push({x: a.x + (b.x - a.x) * d / L, y: a.y + (b.y - a.y) * d / L}); d += step; }
    carry = d - L;
  } return out; }
function smoothClosed(pts, passes){
  let p = pts; for (let k = 0; k < passes; k++){ const n = p.length;
    p = p.map((q, i) => { let sx = 0, sy = 0; for (let j = -3; j <= 3; j++){ const r = p[(i + j + n) % n]; sx += r.x; sy += r.y; } return {x: sx / 7, y: sy / 7}; }); }
  return p; }
function signedArea(p){ let s = 0; for (let i = 0; i < p.length; i++){ const a = p[i], b = p[(i + 1) % p.length]; s += a.x * b.y - b.x * a.y; } return s / 2; }
function coast(pts, kind, seed){

function step(dt, now){
  ents.forEach((e, k) => {
    e.alpha = clamp(e.alpha + (e.gone ? -dt * 1.6 : dt * 1.6), 0, 1);
    if (e.gone && e.alpha <= 0){ ents.delete(k); if (selected === k) selected = null; return; }
    if (e.fly){ const f = e.fly;
      const goal = (f.hint === 'resa' && e.framsteg != null) ? Math.min(f.pmax, Math.max(0.05, e.framsteg)) : f.pmax;
      f.p = Math.min(goal, f.p + dt / f.dur * (f.p > goal ? 0 : 1));
      if (f.p >= 1){ e.x = f.tx; e.y = f.ty; e.h = 0; e.fly = null; e.tx = e.x; e.ty = e.y; e.wait = 1 + Math.random() * 2; }
      else { const q = ease(f.p); e.x = f.fx + (f.tx - f.fx) * q; e.y = f.fy + (f.ty - f.fy) * q;
        e.h = f.hmax * Math.sin(Math.PI * f.p) + (f.p >= f.pmax - 1e-3 ? 4 * Math.sin(now / 400 + hash(e.namn)) : 0); e.vx = f.tx - f.fx; }
      return; }
    e.h = 0;
    const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
    const moving = d > 0.8;
    if (moving){ const sp = (e.akt === 'idle' ? 13 : 32) * dt, k = Math.min(1, sp / d); e.x += dx * k; e.y += dy * k; e.vx = dx; e.walk = (e.walk || 0) + dt; }
    else { e.walk = 0;
      if (e.akt === 'idle'){ e.wait -= dt; if (e.wait <= 0){ const p = randPt(e.z); if (Math.hypot(p.x - e.x, p.y - e.y) < 120){ e.tx = p.x; e.ty = p.y; } e.wait = 1.5 + Math.random() * 4; } } }
  });
  helps.forEach((e, k) => { e.alpha = clamp(e.alpha + (e.gone ? -dt * 1.6 : dt * 1.6), 0, 1); if (e.gone && e.alpha <= 0) helps.delete(k); });
  if (boss) boss.hpShown += (boss.hp - boss.hpShown) * Math.min(1, dt * 2);

}

  if (inf && inf.titel){ const t = el('div', 'pc-title', inf.titel); T.parentNode.insertBefore(t, T); }
  const meta = el('div', 'pc-meta'); S.appendChild(meta);
  const add = (lab, val, dot) => { const sp = el('span'); if (dot){ const i = el('i', 'pc-cls'); i.style.background = dot; sp.appendChild(i); }
    if (lab) sp.appendChild(document.createTextNode(lab + ' ')); sp.appendChild(el('b', null, val)); meta.appendChild(sp); };
  add('Level', String(e.niva || '?')); if (inf && inf.paragon) add('Paragon', String(inf.paragon));
  if (inf && inf.klass) add('', CLASS_TXT[inf.klass] || inf.klass, CLASS_COL[inf.klass] || '#9fb3c0');
  if (inf && inf.gs != null) add('Gear score', inf.gs.toLocaleString('en-US'));
  if (inf && inf.guild && inf.guild.namn) add('⚑', inf.guild.namn + (inf.guild.tag ? ' [' + inf.guild.tag + ']' : ''));
  const row = (a, b) => { const d = el('div'); d.appendChild(el('span', null, a + ' ')); d.appendChild(document.createTextNode(b)); R0.appendChild(d); };
  row('Doing:', doing); row('Where:', e.R.namn + ' · ' + e.z.namn);
  if (e.akt === 'resa' && e.malZ) row('Heading to:', e.malZ.R.namn + ' · ' + e.malZ.namn);
  if (!inf || !inf.gear) return;
  const btn = el('button', 'pc-btn', inspOpen ? 'Hide gear ▴' : 'Inspect gear ▾'); R0.appendChild(btn);
  btn.onclick = () => { inspOpen = !inspOpen; inspSlot = null; renderCard(); };
  if (!inspOpen) return;
  if (!CATALOG && inf.gear.some(g => !g.bild || !g.namn)) loadCatalog().then(() => { cardSig = ''; renderCard(); });
  const bar = {}; inf.gear.forEach(g => { bar[g.slot] = g; });
  const slotEl = (sl, art, namn) => { const b = el('button', 'slot'); b.setAttribute('aria-label', namn); const g = bar[sl];
    const bg = el('i', 'sbg'); bg.style.backgroundImage = 'url(assets/slots/slot_' + art + '.webp)';

    b.onclick = () => { inspSlot = inspSlot === sl ? null : sl; renderCard(); }; return b; };
  const doll = el('div', 'doll'), col = list => { const c = el('div', 'dcol'); list.forEach(x => c.appendChild(slotEl(x[0], x[1], x[2]))); return c; };
  doll.appendChild(col(DOLL.left));
  const mid = el('div', 'dmid'); mid.appendChild(slotEl(14, 'gem', 'Character Gem'));
  const fig = CLASS_FIG[inf.klass];
  if (fig){ let n = 0; [[0, 16], [1, 8], [2, 4], [3, 2], [4, 1]].forEach(b => { if (bar[b[0]]) n |= b[1]; });   // som FIGURE_BITS i index.html
    const im = el('img', 'fig'); im.alt = ''; im.draggable = false; im.src = 'assets/character/' + fig + '/' + String(n).padStart(2, '0') + '.webp'; im.onerror = () => im.remove(); mid.appendChild(im); }
  doll.appendChild(mid); doll.appendChild(col(DOLL.right)); R0.appendChild(doll);
  const under = el('div', 'drow'); DOLL.under.forEach(x => under.appendChild(slotEl(x[0], x[1], x[2]))); R0.appendChild(under);
  const line = el('div', 'itemline');
  const all = DOLL.left.concat(DOLL.right, DOLL.under, [[14, 'gem', 'Character Gem']]), pick = all.find(x => x[0] === inspSlot);
  if (pick){ const g = bar[pick[0]];
    if (g){ const L = itemLook(g), b = el('b', null, L.namn); b.style.color = RAR[g.rarity][1]; line.appendChild(b);
      line.appendChild(el('small', null, pick[2] + ' · ' + RAR[g.rarity][0] + (g.level != null ? ' · ilvl ' + g.level : ''))); }
    else line.appendChild(el('small', null, pick[2] + ' · empty')); }
  else line.appendChild(el('small', null, inf.gear.length ? 'Tap a piece to see what it is' : 'Wearing nothing'));
  R0.appendChild(line);
}
function renderCard(){
  const card = $('card'), hd = $('cardHd'), T = $('cardT'), S = $('cardS'), R0 = $('cardR');
  const e = selected && ents.get(selected);
  if (e){ renderPlayerCard(e); return; }
  card.classList.remove('pl'); cardSig = '';
  const R = selRegion && REG_BY[selRegion];
  { const old = card.querySelector('.pc-title'); if (old) old.remove(); }
  if (R && !R.locked){ card.className = 'on'; hd.style.backgroundImage = 'url(assets/bg/region/' + R.id + '.webp)';
    T.textContent = R.namn; const zc = {}; let n = 0; ents.forEach(x => { if (x.R === R && !x.gone){ zc[x.z.i] = (zc[x.z.i] || 0) + 1; n++; } });
    S.textContent = 'Level ' + R.band + ' · ' + n + ' online'; R0.textContent = '';
    R.zones.forEach(zn => { const d = document.createElement('div'); const s = document.createElement('span'); s.textContent = (zn.i === 5 ? '🏰 ' : '') + zn.namn + ' ';
      d.appendChild(s); d.appendChild(document.createTextNode(zc[zn.i] ? String(zc[zn.i]) : '—')); R0.appendChild(d); });
    return; }
  card.className = ''; }
$('cardX').onclick = () => { selected = null; selRegion = null; renderCard(); };
$('zin').onclick = () => { camAnim.on = false; zoomAt(W / 2, H / 2, 1.4); };
$('zout').onclick = () => { camAnim.on = false; zoomAt(W / 2, H / 2, 1 / 1.4); };

/* ===== INMATNING: dra, nyp, hjul, tryck ===== */
const ptrs = new Map(); let pinch = null, downAt = null, moved = 0, lastTap = 0;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); touched = true; ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); camAnim.on = false;
  if (ptrs.size === 1){ downAt = {x: e.clientX, y: e.clientY, t: performance.now()}; moved = 0; cv.classList.add('drag'); }
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z}; moved = 99; } });
cv.addEventListener('pointermove', e => { const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){ cam.x -= dx / cam.z; cam.y -= dy / cam.z; moved += Math.abs(dx) + Math.abs(dy); clampCam(); }
  else if (ptrs.size === 2 && pinch){ const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.x -= dx / 2 / cam.z; cam.y -= dy / 2 / cam.z; zoomAt(mx, my, (pinch.z * d / pinch.d) / cam.z); } });
function endPtr(e){ if (!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (ptrs.size === 0){ cv.classList.remove('drag');
    if (downAt && moved < 8 && e.type === 'pointerup') tap(e.clientX, e.clientY); downAt = null; } }
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e => { e.preventDefault(); camAnim.on = false; zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.deltaMode ? 0.05 : 0.0015))); }, {passive: false});
function regionAt(sx, sy){ const p = toProj(sx, sy); return LAND.find(R => R.pPolys.some(pp => inPoly(pp, p.x, p.y))); }
function tap(sx, sy){
  const now = performance.now(), dbl = now - lastTap < 320; lastTap = now;
  let best = null, bd = 22; const k = figK(cam.z);
  ents.forEach((e, key) => { const q = toScreen(P(e.x, e.y, (e.h || 0) + 8 * k)); const d = Math.hypot(q.x - sx, q.y - sy); if (d < bd){ bd = d; best = key; } });
  if (best){ if (selected !== best) inspSlot = null; selected = best; selRegion = null; renderCard(); return; }
  if (boss){ const q = toScreen(P(boss.x, boss.y, 60)); if (Math.hypot(q.x - sx, q.y - sy) < Math.max(30, 70 * cam.z)){ const p = P(boss.x, boss.y, 0); flyTo({x: p.x, y: p.y - 60, z: Math.max(cam.z, 1.6)}); return; } }
  const R = regionAt(sx, sy);
  selected = null; selRegion = R ? R.id : null; renderCard();
  if (R && (dbl || cam.z < regionView(R).z * 0.6)) focusRegion(R);
}
addEventListener('keydown', e => { if (e.key === '+' || e.key === '=') zoomAt(W / 2, H / 2, 1.25); else if (e.key === '-') zoomAt(W / 2, H / 2, 0.8); else if (e.key === 'Escape'){ selected = null; selRegion = null; renderCard(); } });
let touched = false;   // har tittaren flyttat kameran? annars foljer oversikten fonsterstorleken
addEventListener('resize', () => { resize(); if (!touched && !camAnim.on){ const o = fitBox(WB, 16); cam.x = o.x; cam.y = o.y; cam.z = o.z; } clampCam(); });

/* ===== DATA: riktig kalla eller DEMO ===== */
let offline = false, viaMsg = false, demoTimer = null;
async function poll(){
  try { const r = await fetch(SRC, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); const j = await r.json(); offline = false; applyData(j); }
  catch (err){ offline = true; renderStatus();
    if (!data){ const n = $('note'); n.style.display = 'block'; n.textContent = 'No world data yet — trying again…'; } }
  if (data) $('note').style.display = 'none';
  setTimeout(poll, EVERY); }
addEventListener('message', ev => { const d = ev.data && ev.data.genesisWorld; if (!d) return; viaMsg = true; if (demoTimer){ clearInterval(demoTimer); demoTimer = null; } offline = false; applyData(d); });

/* DEMO: pahittade namn och en bosscykel som snurrar pa ett par minuter. Inget har kommer fran spelet. */
const DEMO = (() => {
  const A = ['Bram', 'Zyl', 'Mor', 'Kes', 'Tov', 'Quil', 'Vex', 'Ash', 'Lun', 'Pip', 'Grim', 'Ola', 'Nix', 'Dru', 'Fen', 'Ivo', 'Ryl', 'Sab', 'Tam', 'Wib'];
  const B = ['nock', 'la', 'wick', 'ra', 'ek', 'lon', 'ix', 'by', 'mo', 'dle', 'gar', 'fi', 'tus', 'ven', 'zo'];
  const r = rng(20261028), names = new Set();
  while (names.size < 46) names.add(A[Math.floor(r() * A.length)] + B[Math.floor(r() * B.length)] + (r() < .25 ? Math.floor(r() * 99) : ''));
  const regs = LAND.map(R => R.id);
  const pl = [...names].map((n, i) => { const ri = Math.min(4, Math.floor(Math.pow(r(), 1.3) * 5)), R = REG_BY[regs[ri]];
    return {namn: n, niva: ri * 10 + 1 + Math.floor(r() * 10), region: R.id, zon: R.zoner[Math.floor(r() * 5)], aktivitet: 'idle', mal: null}; });
  const ACT = ['idle', 'idle', 'idle', 'strid', 'strid', 'yrke', 'expedition', 'dungeon', 'resa'];
  /* pahittad spelarinfo: riktiga pjasnycklar ur spelets katalog sa bilderna syns, men namnen ar pahittade */
  const DK = {0: ['runners_cap', 'phase_cap', 'sig_lamphelm', 'sigv_bulkhelm'], 1: ['runners_vest', 'phase_vest', 'sig_rockplate', 'sigv_plating'],
    2: ['runners_trousers', 'phase_trousers', 'sig_seamguards', 'sigv_hullwalkers'], 3: ['runners_gloves', 'phase_gloves', 'sig_grippers', 'sigv_breachers'],
    4: ['runners_boots', 'phase_boots', 'sig_tunnelstompers', 'sigv_maglocks'], 5: ['runners_dagger', 'voidsteel_blade', 'sigw_talon', 'sigv_blade'],
    6: ['salvage_neck', 'genesis_neck', 'sigu_charm', 'neck_runners_sleeve'], 7: ['salvage_waist', 'genesis_waist', 'sigv_belt', 'waist_runners_belt'],
    8: ['salvage_ring', 'voidsteel_band', 'ring_copper_band', 'sigu_band'], 9: ['salvage_offhand', 'genesis_offhand', 'sigv_coil', 'offhand_arc_torch'],
    11: ['salvage_transport', 'genesis_transport', 'sigv_pod', 'transport_sky_lance'], 12: ['salvage_ring', 'voidsteel_band', 'ring_copper_band', 'sigu_band'],
    13: ['salvage_relic', 'sigu_colors', 'relic_steel_core', 'relic_orb_of_the_ancients']};
  const KL = Object.keys(CLASS_TXT), TIT = ['', '', 'the Unbroken', 'Dungeon Delver', 'Boss Slayer', 'Wanderer', 'Master Crafter'];
  const GU = [null, {namn: 'Iron Owls', tag: 'OWL'}, {namn: 'Night Shift', tag: 'NS'}, {namn: 'Cubehold', tag: 'CUBE'}, {namn: 'Salt & Steel', tag: 'S&S'}];
  pl.forEach(p => { const rar = () => clamp(Math.floor(p.niva / 10 + r() * 2 - .5), 0, 5), gear = [];
    Object.keys(DK).forEach(sl => { if (r() < (p.niva < 10 ? .45 : .9)){ const l = DK[sl]; gear.push({slot: +sl, key: l[Math.floor(r() * l.length)], rarity: rar(), level: Math.max(1, p.niva - Math.floor(r() * 4))}); } });
    p.info = {klass: KL[Math.floor(r() * KL.length)], paragon: p.niva >= 48 ? Math.floor(r() * 40) : 0, titel: TIT[Math.floor(r() * TIT.length)],
      guild: GU[Math.floor(r() * GU.length)], gs: Math.round(p.niva * 42 + r() * 300), gear}; });
  pl.forEach(p => { p.aktivitet = ACT[Math.floor(r() * ACT.length)]; if (p.aktivitet === 'dungeon') p.zon = REG_BY[p.region].zoner[5]; if (p.aktivitet === 'resa') p.aktivitet = 'idle'; });
  const helpare = ['Pip', 'Bolt', 'Moss', 'Tink', 'Rook', 'Fizz', 'Dot', 'Nib'].map((h, i) => { const o = pl[i * 5]; return {namn: h, agare: o.namn, region: o.region, zon: REG_BY[o.region].zoner[(i * 3) % 5]}; });
  const BOSSES = [['Vharok', 'vharok', 'drakemark', 'The Spine'], ['Gravmaw', 'gravmaw', 'voxholm', 'The Mineshaft'], ['Leviathan', 'leviathan', 'cutlassbay', 'Wreck Reef'],
                  ['Omega', 'omega', 'novacommand', 'Asteroid Field'], ['Bloom', 'bloom', 'quarantine', 'The Farm']];
  let bi = 0, bStart = Date.now() + 45000, bossObj = null;
  /* ?demo-boss=pagar|dod hoppar fram i bosscykeln (for skarmbilder) */
  if (Q.get("demo-boss") === "pagar") bStart = Date.now() - 25000; else if (Q.get("demo-boss") === "dod") bStart = Date.now() - 95000;
  function tick(){
    const now = Date.now();
    pl.forEach(p => {
      if (p.aktivitet === 'resa'){ if (r() < .45){ p.region = p.mal.region; p.zon = p.mal.zon; p.mal = null; p.aktivitet = r() < .5 ? 'idle' : 'strid'; } return; }
      const x = r(); if (x > .16) return;
      if (x < .07){ const other = r() < .7 ? p.region : regs[clamp(regs.indexOf(p.region) + (r() < .5 ? -1 : 1), 0, 4)];
        const zi = Math.floor(r() * 5); p.aktivitet = 'resa'; p.mal = {region: other, zon: REG_BY[other].zoner[zi]};
        if (p.mal.region === p.region && p.mal.zon === p.zon) p.mal.zon = REG_BY[other].zoner[(zi + 1) % 5]; }
      else { p.aktivitet = ACT[Math.floor(r() * ACT.length)]; if (p.aktivitet === 'resa') p.aktivitet = 'yrke';
        if (p.aktivitet === 'dungeon') p.zon = REG_BY[p.region].zoner[5]; else if (p.zon === REG_BY[p.region].zoner[5]) p.zon = REG_BY[p.region].zoner[0]; }
    });
    /* boss: annonserad 45 s -> strid ~90 s -> dod 30 s -> nasta */
    const B0 = BOSSES[bi % BOSSES.length];
    if (now < bStart) bossObj = {namn: B0[0], nyckel: B0[1], region: B0[2], zon: B0[3], lage: 'annonserad', hp_pct: 100, start: new Date(bStart).toISOString()};
    else if (now < bStart + 90000){ const hp = Math.max(1, Math.round(100 - (now - bStart) / 900));
      bossObj = {namn: B0[0], nyckel: B0[1], region: B0[2], zon: B0[3], lage: 'pagar', hp_pct: hp};
      pl.forEach((p, i) => { if (i % 4 === 0 && p.aktivitet !== 'resa' && p.aktivitet !== 'dungeon'){ p.region = B0[2]; p.zon = B0[3]; p.aktivitet = 'strid'; } }); }
    else if (now < bStart + 120000) bossObj = {namn: B0[0], nyckel: B0[1], region: B0[2], zon: B0[3], lage: 'dod', hp_pct: 0};
    else { bi++; bStart = now + 45000; return tick(); }
    return {uppdaterad: new Date(now).toISOString(), regioner: [], spelare: pl.map(p => Object.assign({}, p)), helpare, worldboss: bossObj};
  }
  return {tick};
})();

resize();
const ov = fitBox(WB, 16); cam.x = ov.x; cam.y = ov.y; cam.z = ov.z;
if (SRC) poll();
else { applyData(DEMO.tick()); demoTimer = setInterval(() => applyData(DEMO.tick()), 6000); }
/* ?view= hoppar direkt till en region eller till bossen (bossen kan forst komma med datan) */
(function startView(tries){ const v = (Q.get('view') || '').toLowerCase(); if (!v) return;
  if (v === 'boss'){ if (!boss){ if (tries < 40) setTimeout(() => startView(tries + 1), 250); return; }
    const p = P(boss.x, boss.y, 0), o = {x: p.x, y: p.y - 60, z: 1.6}; cam.x = o.x; cam.y = o.y; cam.z = o.z; touched = true; return; }
  const R = REG_BY[v]; if (R && !R.locked){ const o = regionView(R);
    cam.x = o.x; cam.y = o.y; cam.z = o.z; touched = true; if (W >= 640){ selRegion = R.id; renderCard(); } } })(0);
renderStatus(); renderChips();
